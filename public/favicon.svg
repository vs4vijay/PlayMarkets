<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003791"/>
      <stop offset="60%" stop-color="#1a4fab"/>
      <stop offset="100%" stop-color="#FF7722"/>
    </linearGradient>
  </defs>

  <!-- Ball body -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <circle cx="22" cy="18" r="10" fill="rgba(255,255,255,0.06)"/>

  <!-- PRIMARY SEAM — upward arch (visual metaphor: market trend ↑) -->
  <path d="M 7 41 C 15 11, 49 11, 57 41"
        stroke="white" stroke-width="3" fill="none"
        stroke-linecap="round"/>

  <!-- Stitch marks crossing primary seam (perpendicular, inward/outward pairs) -->
  <!-- Left anchor -->
  <line x1="10" y1="36" x2="15" y2="30" stroke="rgba(255,255,255,0.85)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Left-mid -->
  <line x1="20" y1="19" x2="23" y2="13" stroke="rgba(255,255,255,0.85)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Peak -->
  <line x1="32" y1="14" x2="32" y2="7"  stroke="rgba(255,255,255,0.85)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right-mid -->
  <line x1="44" y1="19" x2="41" y2="13" stroke="rgba(255,255,255,0.85)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right anchor -->
  <line x1="54" y1="36" x2="49" y2="30" stroke="rgba(255,255,255,0.85)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- SECONDARY SEAM — downward arch (completes the ball's equatorial seam) -->
  <path d="M 7 41 C 15 60, 49 60, 57 41"
        stroke="rgba(255,255,255,0.38)" stroke-width="2" fill="none"
        stroke-linecap="round"/>

  <!-- Lower stitch marks (faint) -->
  <line x1="12" y1="48" x2="17" y2="54" stroke="rgba(255,255,255,0.28)" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="61" stroke="rgba(255,255,255,0.28)" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="52" y1="48" x2="47" y2="54" stroke="rgba(255,255,255,0.28)" stroke-width="1.4" stroke-linecap="round"/>
</svg>
